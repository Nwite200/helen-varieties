name = "helen-varieties"
main = "functions/api/index.ts"
compatibility_date = "2024-09-23"

# Serve the built frontend; only /api/* runs the Worker first
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "helens-varieties-db"
database_id = "24c0c802-fcd0-4ce6-ab4d-4620f5ca5997"

# Cloudflare R2 Storage Binding for Product Media
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "helens-varieties-media"

[vars]
WHATSAPP_PHONE = "07032583937"
WHATSAPP_INTERNATIONAL = "2347032583937"
BRAND_NAME = "Helen's Varieties Venture"
